# ──────────────────────────────────────────────────────────────
# JarvisAndroid — GitHub Actions CI: Build Debug APK
# ──────────────────────────────────────────────────────────────
# This workflow runs on every push/PR to main, or on-demand via
# the "Run workflow" button in the Actions tab.
#
# It builds a debug APK on a free GitHub-hosted runner (no local
# Android SDK required) and uploads it as a downloadable artifact.
# ──────────────────────────────────────────────────────────────

name: Build Debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:          # manual "Run workflow" button

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Check out the repository ──────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Install JDK 17 (required by AGP 8.x) ─────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Set up Gradle with caching ────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      # ── 4. Accept Android SDK licenses ───────────────────────
      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      # ── 5. Install required SDK platform & build tools ───────
      - name: Install Android SDK components
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # ── 6. Build the debug APK ───────────────────────────────
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      # ── 7. Upload APK as a downloadable artifact ─────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
